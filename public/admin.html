<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Rizan Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141412;--card2:#1a1915;--ink:#f4efe6;--mute:#9b978f;--gold:#b8935a;--gold2:#d9bb86;--line:rgba(244,239,230,.12);--bad:#e07a6b;--good:#4ec28a;--warn:#e0b46b;--blue:#7aa7e0}
a{text-decoration:none}*{box-sizing:border-box;margin:0}body{font:400 15px/1.5 Jost,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}[hidden]{display:none!important}:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
input,select,textarea{width:100%;background:#0d0d0b;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--gold);background:none;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:500;white-space:nowrap}.btn:hover{background:rgba(184,147,90,.14)}
.btn.g{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#14100a;border-color:transparent}.btn.g:hover{filter:brightness(1.08)}.btn.s{padding:6px 12px;font-size:13px}.btn:disabled{opacity:.5;pointer-events:none}.btn.d{border-color:var(--bad);color:var(--bad)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}aside img{height:40px;width:fit-content;border-radius:6px;margin:0 8px 18px}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--mute);cursor:pointer;background:none;border:0;text-align:left;width:100%}.nv:hover{color:var(--ink);background:var(--card)}.nv.on{background:var(--card2);color:var(--gold2)}
.nv b{margin-left:auto;background:var(--gold);color:#14100a;border-radius:10px;font-size:12px;padding:0 8px;font-weight:600}.sp{flex:1}.who{font-size:12px;color:var(--mute);padding:0 12px}
main{padding:28px clamp(16px,3vw,40px) 80px;max-width:1200px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}h1{font-weight:300;font-size:30px}h2{font-weight:500;font-size:16px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.stat small{color:var(--mute);display:block}.stat .v{font-size:28px;font-weight:300;color:var(--gold2);font-variant-numeric:tabular-nums}.stat .n{font-size:12px;color:var(--mute)}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tb input[type=search]{flex:1;min-width:180px}.tb select{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--mute);font-size:14px}.chip.on{border-color:var(--gold);color:var(--gold2)}
.rows{border:1px solid var(--line);border-radius:16px;overflow:hidden}.r{display:grid;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.r:first-child{border-top:0}.r.h{color:var(--mute);font-size:12px;background:var(--card2)}.r.c{cursor:pointer}.r.c:hover{background:var(--card2)}
.rp{grid-template-columns:52px 1fr 130px 90px 110px 150px}.ro{grid-template-columns:150px 1fr 120px 150px 80px}
.th{width:44px;height:44px;border-radius:12px;background:#0d0d0b center/cover;display:grid;place-items:center;font-size:11px;color:var(--gold)}.nm{font-weight:500}.mu{color:var(--mute);font-size:13px}.pr{font-variant-numeric:tabular-nums;color:var(--gold2)}
.pill{display:inline-block;border-radius:999px;padding:2px 11px;font-size:12px;border:1px solid var(--line);white-space:nowrap}.pill.ok,.pill.PAID,.pill.DELIVERED{color:var(--good);border-color:var(--good)}.pill.so,.pill.CANCELLED,.pill.REFUNDED{color:var(--bad);border-color:var(--bad)}.pill.AWAITING_PAYMENT,.pill.hid{color:var(--warn);border-color:var(--warn)}.pill.PROCESSING,.pill.PACKED,.pill.SHIPPED{color:var(--blue);border-color:var(--blue)}
.empty{padding:36px;text-align:center;color:var(--mute)}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.ban{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:18px}.ban i{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}.ban.manual i{background:var(--warn)}.ban.none i{background:var(--bad)}
.au{padding:9px 0;border-top:1px solid var(--line);font-size:14px}.au:first-child{border-top:0}
/* drawer */
#sc{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}#dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column}
#dr header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}#dr .bd{padding:22px;overflow:auto;flex:1}#dr footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .w{grid-column:1/-1}.im{height:130px;border-radius:16px;border:1px dashed var(--line);background:#0d0d0b center/cover;display:grid;place-items:center;color:var(--mute);cursor:pointer;margin-bottom:14px}
.sw{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:0}.sw input{width:auto}.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
#msg{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c1a15;border:1px solid var(--gold);border-radius:14px;padding:12px 20px;opacity:0;transition:.3s;pointer-events:none;z-index:50}#msg.on{opacity:1}
#login{max-width:380px;margin:14vh auto;padding:0 16px}#login img{height:46px;margin-bottom:22px}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;align-items:center}aside img,.who,.sp{display:none}.nv{width:auto;white-space:nowrap}
.rp{grid-template-columns:44px 1fr auto}.rp .hm,.ro .hm{display:none}.ro{grid-template-columns:1fr auto}.r.h{display:none}.fg{grid-template-columns:1fr}}
</style></head><body>
<div id="login" hidden><img src="/logo.png" alt="Rizan"><div class="card"><h2>Admin sign in</h2><div class="g2" style="grid-template-columns:1fr"><div><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div><div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div><button class="btn g" id="go">Sign in</button><p class="mu" id="le" role="alert"></p></div></div></div>
<div class="app" id="app" hidden>
<aside><img src="/logo.png" alt="Rizan"><button class="nv" data-v="overview">Overview</button><button class="nv" data-v="products">Products</button><button class="nv" data-v="orders">Orders <b id="nb" hidden></b></button><button class="nv" data-v="market">Market rates</button><button class="nv" data-v="activity">Activity</button><div class="sp"></div><a class="nv" href="/" target="_blank" rel="noopener">View shop ↗</a><div class="who" id="who"></div><button class="nv" id="out">Sign out</button></aside>
<main id="main"></main></div>
<div id="sc" hidden></div><div id="dr" hidden style="display:none"></div><div id="msg" role="status"></div><input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sgd=c=>c==null?'Unavailable':'S$'+(c/100).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2}),dt=d=>new Date(d).toLocaleString('en-SG',{dateStyle:'medium',timeStyle:'short'});
const ST=['AWAITING_PAYMENT','PAID','PROCESSING','PACKED','SHIPPED','DELIVERED','CANCELLED','REFUNDED'],lbl=s=>s.replace('_',' ').toLowerCase().replace(/^./,c=>c.toUpperCase());
let D=null,V=location.hash.slice(1)||'overview',F={q:'',metal:'all',st:'all'},P=null;
let tt;const toast=t=>{$('msg').textContent=t;$('msg').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('msg').classList.remove('on'),2800)};
async function api(m,p,b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(r.status===401&&p!=='/api/admin/login')gate(false);if(!r.ok)throw new Error(j.message||j.error||'Error');return j}
function gate(a){$('login').hidden=a;$('app').hidden=!a;if(!a)closeDr()}
$('go').onclick=async()=>{try{await api('POST','/api/admin/login',{email:$('em').value,password:$('pw').value});$('pw').value='';load()}catch(e){$('le').textContent=e.message==='TOO_MANY_ATTEMPTS'?'Too many attempts. Try again in 15 minutes.':'Invalid email or password.'}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click()};$('out').onclick=async()=>{await api('POST','/api/admin/logout').catch(()=>{});gate(false)};
async function load(){try{D=await api('GET','/api/admin/state');gate(true);render()}catch{gate(false)}}
function go(v){V=v;location.hash=v;render()}document.querySelectorAll('.nv[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
const paid=o=>['PAID','PROCESSING','PACKED','SHIPPED','DELIVERED'].includes(o.status),thumb=p=>`<div class="th" style="${p.image?`background-image:url('${esc(p.image)}')`:''}">${p.image?'':esc(p.weight+p.weightUnit)}</div>`;
function render(){if(!D)return;const open=D.orders.filter(o=>o.status==='AWAITING_PAYMENT').length;$('nb').hidden=!open;$('nb').textContent=open;
 document.querySelectorAll('.nv[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===V));$('main').innerHTML=(VIEWS[V]||VIEWS.overview)()}
const mban=()=>{const m=D.market,t={live:`Live feed active. Gold ${sgd(m.gold*100)}/g · Silver ${sgd(m.silver*100)}/g`,manual:`Live feed is down. Using your manual rates: gold ${sgd(m.gold*100)}/g · silver ${sgd(m.silver*100)}/g`,none:'No price available. The shop shows "Price unavailable" until the live feed or manual rates work.'};return`<div class="ban ${m.source}"><i></i><span>${t[m.source]}</span></div>`};
const oRow=o=>`<div class="r ro c" data-o="${o.id}"><div><div class="nm">${esc(o.number)}</div><div class="mu">${dt(o.createdAt)}</div></div><div>${esc(o.customer.name)}<div class="mu hm">${o.items.reduce((s,i)=>s+i.qty,0)} item(s)</div></div><div class="pr">${sgd(o.totalCents)}</div><div class="hm"><span class="pill ${o.status}">${lbl(o.status)}</span></div><div class="hm mu">View</div></div>`;
const VIEWS={
overview(){const o=D.orders,pr=D.products,rev=o.filter(paid).reduce((s,x)=>s+x.totalCents,0),ship=o.filter(x=>['PAID','PROCESSING','PACKED'].includes(x.status)).length,low=pr.filter(p=>p.active&&(!p.available||(p.stock!=null&&p.stock<=3)));
 return`<div class="top"><h1>Overview</h1></div>${mban()}<div class="stats"><div class="stat"><small>Revenue (paid orders)</small><div class="v">${sgd(rev)}</div><div class="n">${o.filter(paid).length} orders</div></div><div class="stat"><small>Awaiting payment</small><div class="v">${o.filter(x=>x.status==='AWAITING_PAYMENT').length}</div><div class="n">contact these customers</div></div><div class="stat"><small>To fulfil</small><div class="v">${ship}</div><div class="n">paid, not yet shipped</div></div><div class="stat"><small>Products live</small><div class="v">${pr.filter(p=>p.available).length}/${pr.length}</div><div class="n">${low.length} need attention</div></div></div>
 <div class="card"><h2>Recent orders</h2><div class="rows">${o.slice(0,6).map(oRow).join('')||'<div class="empty">No orders yet. They appear here as soon as a customer checks out.</div>'}</div></div>
 <div class="card"><h2>Needs attention</h2>${low.map(p=>`<div class="au"><b>${esc(p.name)}</b> <span class="mu">${p.available?`only ${p.stock} left`:'sold out or unpriced'}</span></div>`).join('')||'<span class="mu">Everything is in stock.</span>'}</div>`},
products(){const l=D.products.filter(p=>(F.metal==='all'||p.metal===F.metal)&&(!F.q||(p.name+p.manufacturer).toLowerCase().includes(F.q.toLowerCase())));
 return`<div class="top"><h1>Products</h1><button class="btn g" data-new>+ Add product</button></div><div class="tb"><input type="search" id="fq" placeholder="Search products" value="${esc(F.q)}" aria-label="Search"><select id="fm" aria-label="Metal"><option value="all">All metals</option><option ${F.metal==='gold'?'selected':''}>gold</option><option ${F.metal==='silver'?'selected':''}>silver</option></select></div>
 <div class="rows"><div class="r rp h"><span></span><span>Product</span><span class="hm">Selling price</span><span class="hm">Stock</span><span class="hm">Status</span><span></span></div>${l.map(p=>`<div class="r rp c" data-p="${p.id}">${thumb(p)}<div><div class="nm">${esc(p.name)}</div><div class="mu">${esc(p.manufacturer||'—')} · ${esc(p.weight+p.weightUnit)} · ${(p.purity*1000).toFixed(1)}</div></div><div class="pr hm">${sgd(p.finalCents)}</div><div class="hm">${p.stock==null?'∞':p.stock}</div><div class="hm"><span class="pill ${!p.active?'hid':p.available?'ok':'so'}">${!p.active?'Hidden':p.available?'Available':'Sold out'}</span></div><div style="text-align:right"><button class="btn s" data-so="${p.id}">${p.soldOut?'Back in stock':'Sold out'}</button></div></div>`).join('')||'<div class="empty">No products match.</div>'}</div>`},
orders(){const c=s=>D.orders.filter(o=>s==='all'||o.status===s).length,l=D.orders.filter(o=>F.st==='all'||o.status===F.st);
 return`<div class="top"><h1>Orders</h1></div><div class="chips">${['all',...ST].map(s=>`<button class="chip ${F.st===s?'on':''}" data-st="${s}">${s==='all'?'All':lbl(s)} ${c(s)}</button>`).join('')}</div><div class="rows"><div class="r ro h"><span>Order</span><span>Customer</span><span>Total</span><span>Status</span><span></span></div>${l.map(oRow).join('')||'<div class="empty">No orders in this view.</div>'}</div>`},
market(){const s=D.spot;return`<div class="top"><h1>Market rates</h1></div>${mban()}<div class="card"><h2>Manual fallback rates (SGD per gram)</h2><p class="mu" style="margin-bottom:14px">Prices come from the live feed automatically. These rates are only used when the feed has been down for 5+ minutes. Last updated: ${s.updatedAt?dt(s.updatedAt):'never'}</p><div class="g2"><div><label for="sg">Gold 999.9 / g</label><input id="sg" type="number" step="0.01" min="0" value="${s.gold??''}"></div><div><label for="ss">Silver 999 / g</label><input id="ss" type="number" step="0.01" min="0" value="${s.silver??''}"></div><div><label for="sr">Reason (logged)</label><input id="sr" placeholder="e.g. morning update"></div><button class="btn g" id="sv">Save rates</button></div></div>`},
activity(){return`<div class="top"><h1>Activity</h1></div><div class="card">${D.audit.map(a=>`<div class="au"><span class="mu">${dt(a.at)} · ${esc(a.by)}</span><br>${esc(a.detail)}${a.reason?` <i class="mu">(${esc(a.reason)})</i>`:''}</div>`).join('')||'<span class="mu">No changes yet.</span>'}</div>`}};
/* drawer */
function dr(title,body,foot){$('dr').innerHTML=`<header><h2 style="margin:0">${title}</h2><button class="btn s" data-x aria-label="Close">Close</button></header><div class="bd">${body}</div><footer>${foot}</footer>`;$('dr').hidden=$('sc').hidden=false;$('dr').style.display='flex'}
function closeDr(){$('dr').hidden=$('sc').hidden=true;$('dr').style.display='none';P=null}
const sel=(id,k,opts,v)=>`<select id="${id}">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
function openProduct(id){const p=id?D.products.find(x=>x.id===id):{name:'',metal:S0.m,category:'bar',manufacturer:'',weight:1,weightUnit:'g',purity:S0.m==='silver'?.999:.9999,pricingMode:'AUTO',premiumCents:0,discountCents:0,manualPriceCents:null,stock:null,description:'',soldOut:false,active:true,image:''};
 P={id,img:null,cur:p.image};const bg=p.image?`background-image:url('${esc(p.image)}')`:'';
 dr(id?'Edit product':'New product',`<div class="im" id="pim" style="${bg}">${p.image?'':'Click to add a photo'}</div><div class="fg">
 <div class="w"><label for="f-name">Name *</label><input id="f-name" maxlength="120" value="${esc(p.name)}"></div>
 <div><label>Metal</label>${sel('f-metal','',['gold','silver'],p.metal)}</div><div><label>Category</label>${sel('f-cat','',['bar','coin','bullion'],p.category)}</div>
 <div><label>Manufacturer</label><input id="f-mfr" value="${esc(p.manufacturer)}"></div><div><label>Purity (0.9999 = 999.9)</label><input id="f-pur" type="number" step="any" min="0.1" max="1" value="${p.purity}"></div>
 <div><label>Weight *</label><input id="f-wt" type="number" step="any" min="0" value="${p.weight}"></div><div><label>Unit</label>${sel('f-unit','',['g','oz','kg'],p.weightUnit)}</div>
 <div><label>Pricing</label><select id="f-mode"><option value="AUTO" ${p.pricingMode==='AUTO'?'selected':''}>Auto (live spot + premium)</option><option value="MANUAL" ${p.pricingMode==='MANUAL'?'selected':''}>Fixed manual price</option></select></div><div><label>Stock (blank = untracked)</label><input id="f-stock" type="number" min="0" step="1" value="${p.stock??''}"></div>
 <div><label>Premium S$ (added to spot)</label><input id="f-prem" type="number" step="0.01" min="0" value="${p.premiumCents/100}"></div><div><label>Discount S$</label><input id="f-disc" type="number" step="0.01" min="0" value="${p.discountCents/100}"></div>
 <div class="w"><label>Manual price S$ (only for fixed pricing)</label><input id="f-man" type="number" step="0.01" min="0" value="${p.manualPriceCents==null?'':p.manualPriceCents/100}"></div>
 <div class="w"><label>Description (shown on product page)</label><textarea id="f-desc" rows="3" maxlength="2000">${esc(p.description||'')}</textarea></div>
 <label class="sw"><input type="checkbox" id="f-so" ${p.soldOut?'checked':''}> Sold out</label><label class="sw"><input type="checkbox" id="f-act" ${p.active?'checked':''}> Visible in shop</label>
 ${id?`<div class="w kv"><span class="mu">Current selling price</span><b class="pr">${sgd(D.products.find(x=>x.id===id).finalCents)}</b></div>`:''}</div>`,
 `<input id="f-why" placeholder="Reason (logged)" style="flex:1;min-width:140px"><button class="btn g" data-save>${id?'Save changes':'Create product'}</button>${id?`<a class="btn" href="/product/${esc(p.slug)}" target="_blank" rel="noopener">View ↗</a>`:''}`)}
const S0={get m(){return F.metal==='silver'?'silver':'gold'}};
async function saveProduct(btn){const g=i=>$(i).value,name=g('f-name').trim();if(!name)return toast('Name is required');if(g('f-mode')==='MANUAL'&&!g('f-man'))return toast('Enter a manual price');
 const b={name,metal:g('f-metal'),category:g('f-cat'),manufacturer:g('f-mfr'),weight:g('f-wt'),weightUnit:g('f-unit'),purity:g('f-pur'),pricingMode:g('f-mode'),premium:g('f-prem')||0,discount:g('f-disc')||0,manualPrice:g('f-man'),stock:g('f-stock'),description:g('f-desc'),soldOut:$('f-so').checked,active:$('f-act').checked,reason:g('f-why')||(P.id?'Admin update':'New product')};
 btn.disabled=true;try{if(P.img)b.image=(await api('POST','/api/admin/upload',{dataUrl:P.img})).url;
  if(P.id){const r=await api('PATCH','/api/admin/product/'+P.id,b);toast('Saved. Shop price: '+sgd(r.finalCents))}else{await api('POST','/api/admin/product',b);toast('Product created')}
  closeDr();await load()}catch(x){toast(x.message);btn.disabled=false}}
function openOrder(id){const o=D.orders.find(x=>x.id===id),i=ST.indexOf(o.status),nx=i<5?ST[i+1]:null;
 dr(esc(o.number),`<p style="margin-bottom:14px"><span class="pill ${o.status}">${lbl(o.status)}</span> <span class="mu">${dt(o.createdAt)}</span></p><h2>Customer</h2><div class="kv"><span>${esc(o.customer.name)}</span><a href="mailto:${esc(o.customer.email)}" style="color:var(--gold2)">${esc(o.customer.email)}</a></div><div class="kv"><span class="mu">Phone</span><a href="tel:${esc(o.customer.phone)}" style="color:var(--gold2)">${esc(o.customer.phone)}</a></div><div class="kv"><span class="mu">Deliver to</span><span style="text-align:right">${esc(o.address.line1)} ${esc(o.address.line2)}<br>Singapore ${esc(o.address.postalCode)}</span></div>
 <h2 style="margin-top:22px">Items</h2>${o.items.map(t=>`<div class="kv"><span>${t.qty} × ${esc(t.name)}</span><span class="pr">${sgd(t.unitCents*t.qty)}</span></div>`).join('')}<div class="kv"><b>Total</b><b class="pr">${sgd(o.totalCents)}</b></div>
 <h2 style="margin-top:22px">Change status</h2><select id="o-st">${ST.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${lbl(s)}</option>`).join('')}</select><p class="mu" style="margin-top:8px">Cancelling returns the items to stock.</p>`,
 `${nx?`<button class="btn g" data-ost="${id}:${nx}">Mark ${lbl(nx).toLowerCase()}</button>`:''}<button class="btn" data-ost="${id}:*">Apply selected status</button>`)}
async function setStatus(id,st){if(['CANCELLED','REFUNDED'].includes(st)&&!confirm('Set this order to '+lbl(st)+'?'))return;try{await api('PATCH','/api/admin/order/'+id,{status:st});toast('Order updated');closeDr();await load()}catch(x){toast(x.message)}}
document.addEventListener('click',async e=>{const t=e.target,c=s=>t.closest(s);
 if(c('[data-x]')||t===$('sc'))return closeDr();
 let x;if(x=c('[data-so]')){e.stopPropagation();const p=D.products.find(y=>y.id===x.dataset.so);try{await api('PATCH','/api/admin/product/'+p.id,{soldOut:!p.soldOut,reason:'Quick toggle'});toast(p.soldOut?'Back in stock':'Marked sold out');load()}catch(z){toast(z.message)}return}
 if(x=c('[data-p]'))return openProduct(x.dataset.p);if(c('[data-new]'))return openProduct(null);if(x=c('[data-o]'))return openOrder(x.dataset.o);
 if(x=c('[data-st]')){F.st=x.dataset.st;return render()}if(c('[data-save]'))return saveProduct(c('[data-save]'));
 if(x=c('[data-ost]')){let[id,s]=x.dataset.ost.split(':');return setStatus(id,s==='*'?$('o-st').value:s)}
 if(c('#pim'))return $('file').click();
 if(c('#sv')){try{await api('PUT','/api/admin/spot',{gold:$('sg').value,silver:$('ss').value,reason:$('sr').value});toast('Rates saved');load()}catch(z){toast(z.message)}}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){F.q=e.target.value;const p=e.target.selectionStart;render();$('fq').focus();$('fq').setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='fm'){F.metal=e.target.value;render()}if(e.target.id==='f-metal'&&!P.id)$('f-pur').value=e.target.value==='silver'?'0.999':'0.9999'});
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;if(f.size>4e6)return toast('Image must be under 4 MB');const r=new FileReader();r.onload=()=>{P.img=r.result;$('pim').style.backgroundImage=`url('${r.result}')`;$('pim').textContent=''};r.readAsDataURL(f)};
addEventListener('keydown',e=>{if(e.key==='Escape')closeDr()});addEventListener('hashchange',()=>{V=location.hash.slice(1)||'overview';render()});
setInterval(()=>{if(D&&!$('app').hidden&&$('dr').hidden&&!document.activeElement.matches('input,select,textarea'))load()},45000);
load();
</script></body></html>
